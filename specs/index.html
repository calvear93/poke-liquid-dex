      <div class="nm">${nice(p.name)}<small>${dexNum(p.id)}</small></div>
    </div>`;
					})
					.join('');

				const STAT_ORDER = [
					'hp',
					'attack',
					'defense',
					'special-attack',
					'special-defense',
					'speed',
				];
				const statMax = 200;
				const rows = STAT_ORDER.map((key) => {
					const vals = mons.map(
						(p) =>
							(p.stats.find((s) => s.stat.name === key) || {})
								.base_stat || 0,
					);
					const best = Math.max(...vals);
					const cells = vals
						.map((v) => {
							const pct = Math.min(100, (v / statMax) * 100),
								hue = Math.round((v / 200) * 120);
							return `<div class="cmp-cell${v === best && n > 1 ? ' best' : ''}">
        <span class="track"><span class="fill" data-w="${pct}" style="background:linear-gradient(90deg,hsl(${hue} 88% 47%),hsl(${hue + 18} 92% 55%))"></span></span>
        <span class="v">${v}</span></div>`;
						})
						.join('');
					return `<div class="cmp-row"><div class="rlabel">${STAT_ES[key]}</div>
      <div class="cmp-cells" style="grid-template-columns:${cols}">${cells}</div></div>`;
				}).join('');

				const totals = mons.map((p) =>
					p.stats.reduce((s, x) => s + x.base_stat, 0),
				);
				const bestT = Math.max(...totals);
				const totalCells = totals
					.map(
						(v) =>
							`<div class="cmp-cell${v === bestT && n > 1 ? ' best' : ''}"><span class="v">${v}</span></div>`,
					)
					.join('');

				$('#cmpSheet').innerHTML = `
    <div class="d-hero" style="padding-bottom:8px">
      <h1 class="d-name" style="font-size:26px">Comparar</h1>
      <div class="d-genus">Estadísticas base lado a lado</div>
    </div>
    <div class="d-body">
      ${buildRadar(mons)}
      <div class="cmp-cols" style="grid-template-columns:${cols}">${heads}</div>
      <div class="cmp-table">
        ${rows}
        <div class="cmp-row total"><div class="rlabel">Total</div>
          <div class="cmp-cells" style="grid-template-columns:${cols}">${totalCells}</div></div>
      </div>
    </div>`;

				requestAnimationFrame(() =>
					document
						.querySelectorAll('#cmpSheet .fill')
						.forEach((f) => (f.style.width = f.dataset.w + '%')),
				);
			}

			/* Gráfico radar (hexágono) superponiendo a los Pokémon comparados */
			const RADAR_PAL = ['#ff5e8a', '#5b8cff', '#ffb02e'];
			function buildRadar(mons) {
				const keys = [
					'hp',
					'attack',
					'defense',
					'special-attack',
					'special-defense',
					'speed',
				];
				const labels = [
					'PS',
					'Ataque',
					'Defensa',
					'At. Esp.',
					'Def. Esp.',
					'Vel.',
				];
				const cx = 150,
					cy = 140,
					R = 98,
					rings = 4;
				const val = (p, k) =>
					(p.stats.find((s) => s.stat.name === k) || {}).base_stat ||
					0;
				const allVals = mons.flatMap((p) => keys.map((k) => val(p, k)));
				const maxV = Math.max(
					80,
					Math.ceil(Math.max(...allVals) / 20) * 20,
				); // escala relativa
				const ang = (i) => ((-90 + i * 60) * Math.PI) / 180;
				const pt = (i, r) => [
					cx + r * Math.cos(ang(i)),
					cy + r * Math.sin(ang(i)),
				];

				// grilla (hexágonos concéntricos) — currentColor para adaptarse al tema
				let grid = '';
				for (let g = 1; g <= rings; g++) {
					const pts = keys
						.map((_, i) =>
							pt(i, (R * g) / rings)
								.map((n) => n.toFixed(1))
								.join(','),
						)
						.join(' ');
					grid += `<polygon points="${pts}" fill="currentColor" fill-opacity="${g === rings ? 0.05 : 0}" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>`;
				}
				let axes = '',
					labs = '';
				keys.forEach((_, i) => {
					const [x, y] = pt(i, R);
					axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>`;
					const [lx, ly] = pt(i, R + 18);
					const anchor =
						Math.abs(lx - cx) < 6
							? 'middle'
							: lx > cx
								? 'start'
								: 'end';
					labs += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="currentColor" fill-opacity="0.72">${labels[i]}</text>`;
				});
				// polígonos de datos + vértices (fill-opacity en vez de hex de 8 dígitos)
				let polys = '',
					dots = '';
				mons.forEach((p, mi) => {
					const c = RADAR_PAL[mi % RADAR_PAL.length];
					const P = keys.map((k, i) => pt(i, (R * val(p, k)) / maxV));
					polys += `<polygon points="${P.map((a) => a.map((n) => n.toFixed(1)).join(',')).join(' ')}" fill="${c}" fill-opacity="0.32" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
					dots += P.map(
						(a) =>
							`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="3.2" fill="${c}" stroke="#fff" stroke-width="1"/>`,
					).join('');
				});
				const legend = mons
					.map(
						(p, mi) =>
							`<span class="rlg"><span class="rdot" style="background:${RADAR_PAL[mi % RADAR_PAL.length]}"></span>${nice(p.name)}</span>`,
					)
					.join('');

				return `<div class="d-section"><h3>Comparativa</h3>
    <svg class="radar" viewBox="0 0 300 280" role="img" aria-label="Gráfico radar de estadísticas">
      ${grid}${axes}${polys}${dots}${labs}
    </svg>
    <div class="rlegend">${legend}</div></div>`;
			}

			/* ============================================================
   Compartir la ficha como imagen (Canvas, sin dependencias)
   ============================================================ */
			function loadImg(src) {
				return new Promise((res, rej) => {
					const im = new Image();
					im.crossOrigin = 'anonymous';
					im.onload = () => res(im);
					im.onerror = rej;
					im.src = src;
				});
			}
			function rr(ctx, x, y, w, h, r) {
				// rectángulo redondeado
				ctx.beginPath();
				ctx.moveTo(x + r, y);
				ctx.arcTo(x + w, y, x + w, y + h, r);
				ctx.arcTo(x + w, y + h, x, y + h, r);
				ctx.arcTo(x, y + h, x, y, r);
				ctx.arcTo(x, y, x + w, y, r);
				ctx.closePath();
			}
			function hex(c) {
				c = c.replace('#', '');
				if (c.length === 3)
					c = c
						.split('')
						.map((x) => x + x)
						.join('');
				return [
					parseInt(c.slice(0, 2), 16),
					parseInt(c.slice(2, 4), 16),
					parseInt(c.slice(4, 6), 16),
				];
			}
			function mix(a, b, t) {
				const pa = hex(a),
					pb = hex(b);
				const m = (i) => Math.round(pa[i] + (pb[i] - pa[i]) * t);
				return `rgb(${m(0)},${m(1)},${m(2)})`;
			}

			async function shareCard(data) {
				const btn = $('#shareBtn');
				const prev = btn ? btn.innerHTML : '';
				if (btn) {
					btn.innerHTML = '⏳ Generando…';
					btn.disabled = true;
				}
				try {
					const canvas = await makeShareCanvas(data);
					await new Promise((res) =>
						canvas.toBlob(async (blob) => {
							if (blob) {
								const file = new File(
									[blob],
									`${data.name}.png`,
									{ type: 'image/png' },
								);
								if (
									navigator.canShare &&
									navigator.canShare({ files: [file] })
								) {
									try {
										await navigator.share({
											files: [file],
											title: `${data.name} ${data.num}`,
											text: `${data.name} ${data.num} · Pokédex`,
										});
									} catch (e) {}
								} else {
									const a = document.createElement('a');
									a.href = URL.createObjectURL(blob);
									a.download = `${data.name}.png`;
									document.body.appendChild(a);
									a.click();
									a.remove();
									setTimeout(
										() => URL.revokeObjectURL(a.href),
										1000,
									);
								}
							}
							res();
						}, 'image/png'),
					);
				} catch (e) {
					console.error('share', e);
				} finally {
					if (btn)
						setTimeout(() => {
							btn.innerHTML = prev;
							btn.disabled = false;
						}, 500);
				}
			}

			async function makeShareCanvas(data) {
				const W = 800,
					H = 1040,
					S = 2; // S = supersampling (nitidez)
				const canvas = document.createElement('canvas');
				canvas.width = W * S;
				canvas.height = H * S;
				const ctx = canvas.getContext('2d');
				ctx.scale(S, S);
				try {
					await document.fonts.ready;
				} catch (e) {}

				const tint = data.tint || '#5b8cff';
				// fondo degradado + brillo
				const bg = ctx.createLinearGradient(0, 0, 0, H);
				bg.addColorStop(0, tint);
				bg.addColorStop(0.5, mix(tint, '#0b0a16', 0.55));
				bg.addColorStop(1, '#0b0a16');
				ctx.fillStyle = bg;
				ctx.fillRect(0, 0, W, H);
				const glow = ctx.createRadialGradient(
					W / 2,
					120,
					40,
					W / 2,
					120,
					540,
				);
				glow.addColorStop(0, 'rgba(255,255,255,.26)');
				glow.addColorStop(1, 'rgba(255,255,255,0)');
				ctx.fillStyle = glow;
				ctx.fillRect(0, 0, W, H);

				const PAD = 52;
				// cabecera
				ctx.textAlign = 'left';
				ctx.fillStyle = 'rgba(255,255,255,.75)';
				ctx.font = "700 22px 'Manrope',sans-serif";
				ctx.fillText('P O K É D E X', PAD, 78);
				ctx.textAlign = 'right';
				ctx.fillStyle = 'rgba(255,255,255,.65)';
				ctx.font = "700 24px 'Space Mono',monospace";
				ctx.fillText(data.num, W - PAD, 78);

				// nombre
				ctx.textAlign = 'left';
				ctx.fillStyle = '#fff';
				const name = cap(data.name);
				ctx.font = `800 ${name.length > 11 ? 50 : 64}px 'Bricolage Grotesque',sans-serif`;
				ctx.fillText(name, PAD, 150);

				// pills de tipo
				let tx = PAD;
				ctx.font = "700 22px 'Manrope',sans-serif";
				data.types.forEach((t) => {
					const lbl = (TYPE_ES[t] || t).toUpperCase();
					const w = ctx.measureText(lbl).width + 36;
					ctx.fillStyle = TYPE_COLOR[t] || '#777';
					rr(ctx, tx, 176, w, 40, 20);
					ctx.fill();
					ctx.fillStyle = '#fff';
					ctx.textAlign = 'left';
					ctx.fillText(lbl, tx + 18, 203);
					tx += w + 10;
				});

				// artwork con sombra
				try {
					let img;
					try {
						img = await loadImg(ART(data.id));
					} catch (_) {
						img = await loadImg(SPRITE(data.id));
					}
					const size = 440,
						ix = (W - size) / 2,
						iy = 248;
					ctx.fillStyle = 'rgba(0,0,0,.35)';
					ctx.beginPath();
					ctx.ellipse(
						W / 2,
						iy + size - 46,
						size * 0.33,
						28,
						0,
						0,
						Math.PI * 2,
					);
					ctx.fill();
					ctx.drawImage(img, ix, iy, size, size);
				} catch (e) {
					/* sin imagen */
				}

				// panel de estadísticas
				const px = PAD,
					pw = W - PAD * 2,
					py = 720,
					ph = 250;
				ctx.fillStyle = 'rgba(255,255,255,.10)';
				rr(ctx, px, py, pw, ph, 28);
				ctx.fill();
				const rowH = ph / data.stats.length;
				data.stats.forEach((s, i) => {
					const cy = py + i * rowH + rowH / 2,
						v = s.base_stat;
					ctx.textAlign = 'left';
					ctx.fillStyle = 'rgba(255,255,255,.85)';
					ctx.font = "700 18px 'Manrope',sans-serif";
					ctx.fillText(
						STAT_ES[s.stat.name] || s.stat.name,
						px + 22,
						cy + 6,
					);
					ctx.textAlign = 'right';
					ctx.fillStyle = '#fff';
					ctx.font = "700 18px 'Space Mono',monospace";
					ctx.fillText(String(v), px + pw - 22, cy + 6);
					const bx = px + 150,
						bw = pw - 150 - 70,
						bh = 12,
						by = cy - bh / 2;
					ctx.fillStyle = 'rgba(255,255,255,.18)';
					rr(ctx, bx, by, bw, bh, 6);
					ctx.fill();
					const hue = Math.round(Math.min(1, v / 200) * 120);
					ctx.fillStyle = `hsl(${hue} 80% 55%)`;
					rr(
						ctx,
						bx,
						by,
						Math.max(bh, bw * Math.min(1, v / 200)),
						bh,
						6,
					);
					ctx.fill();
				});

				// pie
				ctx.textAlign = 'center';
				ctx.fillStyle = 'rgba(255,255,255,.5)';
				ctx.font = "600 16px 'Manrope',sans-serif";
				ctx.fillText('Datos: PokéAPI  ·  Liquid Glass', W / 2, 1012);

				return canvas;
			}

			/* ============================================================
   Hoja arrastrable (táctil) en móvil
   ============================================================ */
			function setupSheetDrag() {
				const sheet = $('.sheet'),
					scroll = $('#sheet');
				const isMobile = () =>
					window.matchMedia('(max-width:680px)').matches;
				let dragging = false,
					startY = 0,
					dy = 0;
				function start(e) {
					if (!isMobile()) return;
					if (e.target.closest('button')) return; // nunca desde botones
					const fromHandle = !!e.target.closest('#handle');
					const fromHeroTop =
						!!e.target.closest('.d-hero') && scroll.scrollTop <= 0;
					if (!fromHandle && !fromHeroTop) return; // solo asa o hero arriba
					dragging = true;
					startY = e.clientY;
					dy = 0;
					sheet.style.transition = 'none';
				}
				function move(e) {
					if (!dragging) return;
					dy = Math.max(0, e.clientY - startY);
					if (dy > 0) {
						sheet.style.transform = `translateY(${dy}px)`;
						if (e.cancelable) e.preventDefault();
					}
				}
				function up() {
					if (!dragging) return;
					dragging = false;
					sheet.style.transition = '';
					if (dy > 110) closeDetail();
					else sheet.style.transform = '';
				}
				sheet.addEventListener('pointerdown', start);
				window.addEventListener('pointermove', move, {
					passive: false,
				});
				window.addEventListener('pointerup', up);
				window.addEventListener('pointercancel', up);
			}

			function escapeHtml(s) {
				return String(s).replace(
					/[&<>"']/g,
					(c) =>
						({
							'&': '&amp;',
							'<': '&lt;',
							'>': '&gt;',
							'"': '&quot;',
							"'": '&#39;',
						})[c],
				);
			}
		</script>

<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poke Liquid Dex">
  <title>Poke Liquid Dex</title>

  <defs>
    <!-- Panel background -->
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0a1a"/>
      <stop offset="1" stop-color="#070611"/>
    </linearGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="word" x1="430" y1="150" x2="980" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#cdd6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="430" y1="250" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5e8a"/>
      <stop offset="0.5" stop-color="#9650ff"/>
      <stop offset="1" stop-color="#7aa6ff"/>
    </linearGradient>

    <!-- Pokeball glass -->
    <radialGradient id="ballRed" cx="0.38" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#ff7a93"/>
      <stop offset="0.55" stop-color="#ff5267"/>
      <stop offset="1" stop-color="#e23354"/>
    </radialGradient>
    <radialGradient id="ballWhite" cx="0.40" cy="0.78" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe4f7" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="glassHi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3d7f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3c78ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3c78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d9a3" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#00d9a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffaa3c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffaa3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9650ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9650ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="round"><rect x="0" y="0" width="1200" height="400" rx="40"/></clipPath>
    <clipPath id="ballClip"><circle cx="190" cy="200" r="118"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="400" fill="url(#panel)"/>

    <!-- Atmospheric gradient blobs -->
    <g filter="url(#soft)" opacity="0.9">
      <circle cx="170" cy="120" r="200" fill="url(#blobA)"/>
      <circle cx="520" cy="330" r="220" fill="url(#blobB)"/>
      <circle cx="900" cy="90" r="210" fill="url(#blobE)"/>
      <circle cx="1080" cy="320" r="200" fill="url(#blobC)"/>
      <circle cx="760" cy="350" r="170" fill="url(#blobD)"/>
    </g>

    <!-- fine grid sheen -->
    <g opacity="0.06" stroke="#ffffff" stroke-width="1">
      <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200"/>
    </g>

    <!-- ===== Glass Pokeball ===== -->
    <g>
      <!-- drop shadow -->
      <ellipse cx="190" cy="330" rx="120" ry="22" fill="#000000" opacity="0.35" filter="url(#soft)"/>

      <g clip-path="url(#ballClip)">
        <!-- top red glass -->
        <rect x="72" y="82" width="236" height="118" fill="url(#ballRed)" opacity="0.92"/>
        <!-- bottom frosted glass (blobs shine through) -->
        <rect x="72" y="200" width="236" height="118" fill="url(#ballWhite)"/>
        <!-- equator band -->
        <rect x="72" y="188" width="236" height="24" fill="#1a1430"/>
        <!-- inner highlight -->
        <ellipse cx="150" cy="140" rx="70" ry="44" fill="url(#glassHi)" opacity="0.55"/>
      </g>

      <!-- rim -->
      <circle cx="190" cy="200" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
      <circle cx="190" cy="200" r="118" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="1 0" transform="translate(0 2)" opacity="0.2"/>

      <!-- center button -->
      <circle cx="190" cy="200" r="34" fill="#1a1430"/>
      <circle cx="190" cy="200" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="190" cy="200" r="22" fill="#ffffff"/>
      <circle cx="190" cy="200" r="22" fill="url(#glassHi)"/>
      <circle cx="182" cy="192" r="6" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ===== Wordmark ===== -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="408" y="178" font-size="34" font-weight="600" letter-spacing="10" fill="#9aa3d6">P O K É D E X</text>
      <text x="404" y="262" font-size="92" font-weight="800" letter-spacing="-1" fill="url(#word)">Poke Liquid Dex</text>
      <text x="408" y="316" font-size="25" font-weight="500" letter-spacing="0.5" fill="#aeb6e6">Galería de Pokémon · estética liquid glass · PWA</text>
      <rect x="408" y="284" width="430" height="3" rx="1.5" fill="url(#accent)"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>

<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poke Liquid Dex mark">
  <title>Poke Liquid Dex</title>
  <defs>
    <linearGradient id="m-panel" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0a1a"/>
      <stop offset="1" stop-color="#070611"/>
    </linearGradient>
    <radialGradient id="m-red" cx="0.38" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#ff7a93"/>
      <stop offset="0.55" stop-color="#ff5267"/>
      <stop offset="1" stop-color="#e23354"/>
    </radialGradient>
    <radialGradient id="m-white" cx="0.40" cy="0.78" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe4f7" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="m-hi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3d7f" stop-opacity="0.9"/><stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3c78ff" stop-opacity="0.85"/><stop offset="1" stop-color="#3c78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d9a3" stop-opacity="0.75"/><stop offset="1" stop-color="#00d9a3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="m-round"><rect width="320" height="320" rx="72"/></clipPath>
    <clipPath id="m-ball"><circle cx="160" cy="160" r="104"/></clipPath>
    <filter id="m-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <g clip-path="url(#m-round)">
    <rect width="320" height="320" fill="url(#m-panel)"/>
    <g filter="url(#m-soft)" opacity="0.95">
      <circle cx="70" cy="80" r="150" fill="url(#m-a)"/>
      <circle cx="270" cy="120" r="140" fill="url(#m-b)"/>
      <circle cx="200" cy="300" r="150" fill="url(#m-c)"/>
    </g>

    <ellipse cx="160" cy="280" rx="100" ry="18" fill="#000" opacity="0.35" filter="url(#m-soft)"/>
    <g clip-path="url(#m-ball)">
      <rect x="56" y="56" width="208" height="104" fill="url(#m-red)" opacity="0.92"/>
      <rect x="56" y="160" width="208" height="104" fill="url(#m-white)"/>
      <rect x="56" y="149" width="208" height="22" fill="#1a1430"/>
      <ellipse cx="125" cy="108" rx="58" ry="36" fill="url(#m-hi)" opacity="0.55"/>
    </g>
    <circle cx="160" cy="160" r="104" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="160" cy="160" r="30" fill="#1a1430"/>
    <circle cx="160" cy="160" r="30" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="160" cy="160" r="19" fill="#fff"/>
    <circle cx="160" cy="160" r="19" fill="url(#m-hi)"/>
    <circle cx="153" cy="153" r="5" fill="#fff" opacity="0.9"/>
  </g>
  <rect x="1" y="1" width="318" height="318" rx="72" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/>
</svg>
